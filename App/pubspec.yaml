name: taqreeb
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.1.4
  flutter_facebook_auth: ^7.1.1
  dio: ^5.8.0+1
  mime: ^2.0.0
  flutter_chat_ui: ^1.6.15
  video_player: ^2.9.5
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.0.3
  table_calendar: ^3.0.0
  http: ^1.1.0
  share_plus: ^10.1.4
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  firebase_core: ^3.12.1
  font_awesome_flutter: ^10.8.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^19.0.0
  dotenv: ^4.2.0
  flutter_dotenv: ^5.0.2
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.3.4
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2
  google_maps_flutter: ^2.10.0
  flutter_google_places_sdk: ^0.3.2+1
  url_launcher: ^6.3.1
  showcaseview: ^4.0.1
  place_picker_google: ^0.0.14
  geolocator: ^13.0.2
  flutter_typeahead: ^5.2.0
  crop_your_image: ^2.0.0
  image_cropper: ^9.1.0
  path_provider: ^2.1.5
  firebase_storage: ^12.3.7
  intl: ^0.18.0
  google_sign_in: ^6.2.2
  flutter_native_splash: ^2.4.4
  screenshot: ^3.0.0
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  encrypt: ^5.0.3
  pointycastle: ^3.6.2
  flutter_cache_manager: ^3.4.1
  visibility_detector: ^0.4.0+2
  shared_preferences: ^2.5.3
  page_transition: ^2.2.1
  animate_do: ^4.2.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^5.0.0


flutter_launcher_icons:
  android: "adaptive"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/appIcon/taqreebicon.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/appIcon/taqreebicon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Mosk
      fonts:
        - asset: assets/fonts/Mosk Bold 700.ttf
          weight: 700
        - asset: assets/fonts/Mosk Extra-Bold 800.ttf
          weight: 800
        - asset: assets/fonts/Mosk Extra-Light 200.ttf
          weight: 200
        - asset: assets/fonts/Mosk Light 300.ttf
          weight: 300

flutter_native_splash:
  color: "#18191A"
  image: "assets/appIcon/taqreebSplashlogo.png"
  android: true
  ios: true
  web: true

android_12:
  color: "#18191A"
  image: "assets/appIcon/taqreebSplashlogo.png"
